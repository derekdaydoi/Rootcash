<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FDF9F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rootcash" />
  <meta name="format-detection" content="telephone=no" />
  <title>Rootcash</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" href="assets/icon-192.png" sizes="192x192" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash__content">
      <img src="assets/logo-mark.svg" alt="" class="splash__mark" />
      <div class="splash__wordmark">Rootcash</div>
      <p>Chủ động tiền bạc,<br />vững vàng tháng sau</p>
    </div>
    <div class="splash__copyright">© 2026 Rootcash</div>
  </div>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="domain.js"></script>
  <script src="app.js"></script>
</body>
</html>
