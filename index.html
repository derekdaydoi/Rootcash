<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF9F1" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rootcash" />
  <meta name="format-detection" content="telephone=no" />
  <title>Rootcash</title>
  <link rel="icon" type="image/png" sizes="192x192" href="brand/rootcash-icon-r14.png" />
  <link rel="apple-touch-icon" href="brand/rootcash-icon-r14.png" />
  <link rel="manifest" href="manifest.webmanifest?v=20260915-brand-r14" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="styles-overlays.css?v=6" />
</head>
<body>
  <div id="splash" hidden></div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister())).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('rootcash')).map(key => caches.delete(key)))).catch(() => {});
    }
  </script>
  <script src="domain.js?v=6"></script>
  <script src="app/config.js?v=6"></script>
  <script src="app/state.js?v=6"></script>
  <script src="app/screens/base.js?v=6"></script>
  <script src="app/screens/home.js?v=6"></script>
  <script src="app/screens/finance.js?v=6"></script>
  <script src="app/screens/plan.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
